name: CI

# Läuft bei jedem Push auf main und bei jedem Pull Request. Der tägliche Lauf
# in sicherheit-taeglich.yml deckt die Lücke ohne Commit ab.
#
# Keine bezahlten Aufrufe an einen KI-Anbieter: Tests nutzen Attrappen. Echte
# Modellaufrufe der Engine laufen nur auf main und von Hand (siehe engine.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  pruefen:
    name: Geheimnisse, Format, Regeln, Tests, Abhängigkeiten
    runs-on: ubuntu-24.04
    steps:
      # Die ganze Historie: Ein Geheimnis in einem alten Commit ist im
      # öffentlichen Repository weiter lesbar.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binärdatei statt Action, mit geprüfter Prüfsumme aus dem Release.
      # Dieselbe Fassung wie in sicherheit-taeglich.yml – beide zusammen heben.
      - name: gitleaks 8.30.1 holen
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Exit-Code nicht durch eine Pipe verschlucken.
      - name: Secret-Scan über alle Commits
        run: ./gitleaks git . --no-banner --redact

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check:file-length
      - run: bun run typecheck
      - run: bun run test

      # Jede Schutzfunktion einmal kaputt machen: Der passende Test muss rot
      # werden. Eine Sabotage, die grün bleibt, macht diesen Schritt rot.
      - run: bun run sabotage

      # Abhängigkeiten blockieren ab "high", mit denselben Ausnahmen wie der
      # tägliche Lauf (scripts/audit.sh). Der tägliche Lauf meldet schon ab
      # "moderate", blockiert aber nichts.
      - name: Bekannte Schwachstellen
        run: bash scripts/audit.sh high

  web:
    name: Datenbank, Grosshandel und Browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Node 24 führt die TypeScript-Dateien der Attrappe und des
      # Einrichtungsskripts direkt aus.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # Nur Datenbank, Anmeldung und REST; was die Tests nicht brauchen, startet nicht.
      - name: Supabase lokal starten
        run: ./node_modules/.bin/supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Datenbankregeln in beiden Rollen
        run: bun run test:db

      - name: Sabotage an den Datenbankregeln
        run: bun run sabotage:db

      # Konten, Apotheken und Zugänge mit Passwörtern, die nur in diesem Lauf gelten.
      - name: Testdaten einrichten
        run: bun run einrichten

      - name: Browser für die Tests
        run: cd web && ./node_modules/.bin/playwright install --with-deps chromium

      - name: Build und Browser-Tests in drei Breiten
        env:
          CI: '1'
        run: bun run test:e2e

      - name: Bericht der Browser-Tests, falls etwas scheiterte
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-bericht
          path: web/playwright-report
          retention-days: 7

  # Das Abbild für vps1 bei jedem Pull Request bauen und starten, wie es dort
  # läuft (nur lesbar, ohne Rechte). Sonst fiele ein kaputtes Update der
  # Basis-Abbilder erst beim Ausrollen auf.
  abbild:
    name: Abbild der Grosshandel-Attrappe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bauen, starten, anfragen
        run: bash infra/abbild-pruefen.sh
