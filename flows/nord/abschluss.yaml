# yaml-language-server: $schema=../../engine/flow.schema.json
#
# Tagesabschluss an der Kasse Nord: alle offenen Belege in einen Abschluss.
# «Bon leeren» zuerst, damit keine alte Meldung als Ergebnis gelesen wird.
flow: abschluss
apotheke: nord
beschreibung: Tag abschliessen und Belege und Summe lesen
fenster: Kasse Nord
eingaben: []

dialoge:
  - text: Neue Preisliste verfügbar
    klicke: Später

heilung:
  klickbar: [OK, Später, Schliessen]

schritte:
  - klicke: Bon leeren
    danach: Neuer Bon
    wiederholbar: true
  # Der Abschluss lässt sich nicht zurücknehmen: kein zweiter Klick, und fehlt
  # die Bestätigung, heisst der Lauf «unklar», nicht «abgebrochen».
  - klicke: Tagesabschluss
    kritisch: true
    danach:
      eins-von: ['Abschluss', 'keine offenen Belege']
  - beenden-wenn:
      text: 'Abschluss: keine offenen Belege'
      status: nichts-offen
  - lies:
      muster: 'Abschluss (\d+): (\d+) Belege?, ([\d.,]+)'
      als: [abschluss, belege, summe]
